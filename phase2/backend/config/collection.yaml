# Phase 2 collection configuration.

targets:
  google_play: 300
  app_store: 300
  reddit: 150
  reddit_web: 100
  youtube_comments: 100
  quora: 50
  forums_blogs: 50
  product_reviews: 100
  amazon: 50

# Live sources enabled for collection. Reddit/YouTube need credentials (see .env).
enabled_sources:
  - google_play
  - app_store
  - reddit
  - youtube_comments
  - quora

settings:
  retries: 3
  backoff_seconds: 2
  sleep_between_apps_ms: 500
  reddit_sleep_seconds: 2
  count: 100000        # google_play: fetch ALL reviews (paged) in the window
  how_many: 100000      # app_store: fetch ALL reviews
  max_pages: 2000       # hard safety cap on Play pagination (raise if needed)
  reddit_limit: 1000    # Reddit search cap (API max ~1000 per query)
  youtube_max_videos: 5
  youtube_max_comments: 100

# App ids — VERIFY before a live run (public ids may change).
google_play_app_ids:
  - com.myntra.android
app_store_app_ids:
  - 907676859
app_store:
  app_name: myntra

reddit:
  subreddits:
    - IndianFashion
    - OnlineShoppingIndia
    - fashionadvice
  keywords:
    - myntra
    - wishlist
    - "saved for later"
    - sizing
    - "can't decide"

youtube_comments:
  queries:
    - "myntra haul review"
    - "ajio clothes review"
    - "nykaa fashion unboxing"
  max_videos: 3
  max_comments: 30

quora:
  queries:
    - "shopping from myntra sizing"
    - "wishlist vs buying clothes"

# product_reviews (Myntra/Nykaa/AJIO) and amazon live content are fetched
# manually/exported (see phase2 README) and ingested with web_json (custom schema)
# because their public review endpoints are unofficial and ToS-restricted.
product_reviews:
  export: "phase2/data/fixtures/product_reviews_sample.json (pattern for exports)"
amazon:
  export: "ignored here - use web_json custom export"

# Offline fixtures mode uses phase2/data/fixtures/* for a deterministic demo
# and for the evaluator when live credentials/network are unavailable.
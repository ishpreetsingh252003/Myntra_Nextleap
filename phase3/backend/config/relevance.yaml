# Phase 3 config — cleaning thresholds + relevance classifier.
# Aligned with phase1/config/taxonomies (behaviours BEH-*, barriers PB-*).

classifier_version: "rules-v1.0"

# ---- relevance categories (output labels, §6.2 of the architecture plan) ----

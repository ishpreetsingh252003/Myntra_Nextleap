# ---- spam / bot / promotional noise ----  (EC-06, EC-13)
spam:
  promo_terms:
    - "great offer"
    - "best offer"
    - "click here"
    - "buy now"
    - "limited period"
    - "hurry"
    - "sale is live"
    - "earn money"
    - "referral"
    - "claim your"
    - "free gift"
    - "cashback on"
    - "up to 70%"
    - "up to 50%"
    - "shop now"
    - "download now"
    - "watch this video"
  pseudo_latin:  # random letter gibberish ('djjdksl zzmzzm') indicates bots
    max_alpha_signal: 0.35
  repeat:  # same phrase 3+ times in a short text
    max_repeat_ratio: 0.4

# ---- cleaning thresholds ----
cleaning:
  min_text_chars: 10          # EC-07: stars-only / hollow reviews
  out_of_scope_latin_ratio: 0.35  # heavy non-Latin script -> quarantine, never delete (EC-04)
  link_density_max: 6         # more links than this in text -> promo suspicion
  pii_mask: true              # EC-14: mask emails / phones / order numbers

# ---- rule classifier thresholds ----
rules:
  min_strong_hits: 1          # any strong term -> relevant
  min_signal_hits: 2          # ordinary signals needed if no strong term
  strong_weight: 3.0
  signal_weight: 1.0

# ---- optional LLM classifier ----
llm:
  provider: auto              # auto -> anthropic (claude) else openai else none
  anthropic_model: "claude-3-5-sonnet-latest"
  openai_model: "gpt-4o-mini"
  temperature: 0           # EC-43 determinism
  versioned: true          # EC-42 pin prompt + model in output
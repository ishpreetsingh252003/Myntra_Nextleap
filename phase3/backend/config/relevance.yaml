      - "keep postponing"
      - "delaying"
      - "price"
      - "price drop"
      - "goes on sale"

  - id: product_comparison
    label: "Product comparison"
    signal:
      - "compare"
      - "comparing"
      - "comparison"
      - "vs"
      - "versus"
      - "between the"
      - "which one"
      - "which to pick"
      - "better than"
      - "other than this"
      - "alternative"

  - id: fit_size_quality
    label: "Fit / size / quality concerns"
    signal:
      - "size"
      - "sizing"
      - "fit"
      - "fits"
      - "fitting"
      - "fabric"
      - "material"
      - "quality"
      - "stitching"

      - "wishlist"
      - "wish list"
      - "wish listed"
      - "saved for later"
      - "save for later"
      - "added to wishlist"
      - "in my wishlist"
      - "wishlist it"
    signal:
      - "saved it"
      - "save it"
      - "bookmark"
      - "add to cart"
      - "in my cart"
      - "saved items"
      - "for later"
      - "keep it saved"
      - "forgetting"

  - id: purchase_intent
    label: "Purchase intention"
    signal:
      - "i want to buy"
      - "want to buy"
      - "going to buy"
      - "thinking of buying"
      - "thinking to buy"
      - "planning to buy"
      - "plan to buy"
      - "about to order"
      - "about to buy"
      - "ready to buy"
      - "buy this"
      - "order it"
      - "ordering"
      - "shall i buy"
      - "should i buy"
      - "should i order"

  - id: purchase_hesitation
